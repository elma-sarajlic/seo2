name: Daily Assembly Maker SEO Article

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Optional keyword or one-off topic"
        required: false
        type: string
  schedule:
    - cron: "20 5 * * *"

permissions:
  contents: write

concurrency:
  group: daily-assemblymaker-blog
  cancel-in-progress: false

jobs:
  generate-and-submit-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-2.5-flash' }}
      ASSEMBLY_REVIEW_API_URL: ${{ vars.ASSEMBLY_REVIEW_API_URL || 'https://assemblymaker.com/api/seo-review.php?route=' }}
      REVIEW_API_TOKEN: ${{ secrets.REVIEW_API_TOKEN }}
      NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}

    steps:
      - name: Check out website source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: seo/requirements.txt

      - name: Validate secrets
        run: |
          python - <<'PY'
          import os
          required = ["GEMINI_API_KEY", "REVIEW_API_TOKEN"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          print("Required generation and review API secrets are present.")
          PY

      - name: Install generator
        run: python -m pip install -r seo/requirements.txt

      - name: Generate today's article
        env:
          ARTICLE_KEYWORD: ${{ inputs.keyword }}
        run: python seo/generate_article.py

      - name: Validate generated website files
        run: |
          python -m py_compile seo/generate_article.py seo/submit_draft.py
          python -m unittest tests.test_seo_generator
          git diff --check

      - name: Save article history in GitHub
        run: |
          git config user.name "assemblymaker-seo-bot"
          git config user.email "seo-bot@assemblymaker.com"
          git add blog blog.html sitemap.xml seo/state.json seo/draft-payload.json
          if git diff --cached --quiet; then
            echo "No new article changes to commit. The existing draft payload will be retried."
          else
            git commit -m "Create daily Assembly Maker article draft"
            git push
          fi

      - name: Submit article for image and approval
        run: python seo/submit_draft.py
